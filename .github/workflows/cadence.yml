name: Outreach cadence
# The traffic-email sequencer. It QUEUES each lead's due touch into the outbox and
# SENDS NOTHING; sending still happens from the Cockpit. Runs every weekday morning
# so follow-ups schedule themselves, and can still be triggered by hand below.
# Leads who clicked, replied, or booked are excluded automatically, so an engaged
# physician never receives an automated follow-up.
on:
  schedule:
    # Queue BEFORE the send window opens, not after it closes. At 8:10am ET this ran 40 minutes
    # past the end of the 06:30-07:30 window, so nextSlot could only ever give a row the FOLLOWING
    # morning: every touch sat a full day before it was eligible. 09:40 UTC is 05:40 ET, which
    # leaves the queue built and waiting when the window opens.
    # Every day, not 1-5: weekday-restricted crons were not firing here, so the weekend guard in
    # the step below is what stops it.
    # EDT (UTC-4), correct until the clocks go back on 1 Nov 2026, then shift to '40 10'. The EST
    # entry is deliberately not pre-loaded: in September it would fire at 06:40 ET, rebuilding the
    # queue in the middle of the 06:30-07:30 send window.
    - cron: '40 9 * * *'    # ~5:40am ET, ahead of the 6:30 send window
  workflow_dispatch:
    inputs:
      tier:
        description: 'Only this intent tier (A, B, or C). Blank = all.'
        required: false
        default: ''
      specialty:
        description: 'Only this specialty (e.g. Orthopedics). Blank = all.'
        required: false
        default: ''
      limit:
        description: 'Max emails this run (blank = daily cap).'
        required: false
        default: ''

concurrency:
  group: cadence
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Run the cadence sequencer
        env:
          ERIC_USER: eric@mdconcierge.net
          MDRX_ERIC_PASS: ${{ secrets.MDRX_ERIC_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # The managing editor fails CLOSED: with no key it blocks every email and the cadence
          # queues nothing at all. cadence.mjs imports editor.mjs as of 17 Sep 2026, so this key
          # has to reach the runner or the fix for the duplicated opener becomes a silent outage.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.limit }}
        run: |
          # The cron runs every day because weekday-restricted schedules were not firing.
          # Saturday is 6 and Sunday is 7, so anything from 6 up stops here.
          if [ "$(date -u +%u)" -ge 6 ]; then echo "weekend, nothing to do"; exit 0; fi
          node cadence.mjs