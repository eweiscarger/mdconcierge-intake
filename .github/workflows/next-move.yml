name: Smart next-move agent
# Reads each hot lead's behavior and queues an AI-recommended next move (message +
# channel + date) for Eric to approve. SENDS NOTHING (auto-send is gated).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 12 * * 1-5'   # weekdays ~8:23am ET

concurrency:
  group: next-move
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Plan next moves for hot leads
        env:
          ERIC_USER: eric@mdconcierge.net
          MDRX_ERIC_PASS: ${{ secrets.MDRX_ERIC_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node next-move.mjs
