name: Inbox tidy (eric@)

# Keeps machine-generated mail out of Eric's inbox: engine notifications and test
# mail go to Trash, DMARC reports to Archive, calendar notices to Notification.
# Anything that does not match a rule is left exactly where it is, so real mail
# from people is never touched. Set DRY=1 on a manual run to preview.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Set to 1 to preview without moving anything'
        required: false
        default: ''
  schedule:
    - cron: '25 */6 * * *'   # every 6 hours

concurrency:
  group: inbox-tidy
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Tidy the inbox
        env:
          ERIC_PASS: ${{ secrets.MDRX_ERIC_PASS }}
          DRY: ${{ github.event.inputs.dry }}
        run: node inbox-tidy.mjs
