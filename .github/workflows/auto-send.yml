name: Send the day's outreach
# Sends whatever the cadence queued and is due, through the SAME send-outreach function the
# Cockpit button calls, so every guard still applies: no blind tracking token, no cold email to
# someone who has since engaged, nothing to a lead who replied or is on hold, and no second email
# inside 18 hours. Emails Eric a digest of what went and what was held back.
#
# Timed for late morning: of the physicians who can be proven to be real rather than mail
# gateways, every one engaged in the 1pm hour, and almost none before 10am. This lands the mail
# near the top of the inbox before they break between morning and afternoon clinic.
# Runs every 15 minutes across the band that could contain a send window in any US timezone. It
# does NOT decide when to send: each email carries its own randomised moment inside a permitted
# window in the physician's own timezone, and this job simply gives the function chances to notice
# that a moment has arrived. Changing the windows is a config edit, not a change to this file.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Send only these outbox row ids, comma separated. Leave empty to send whatever is due.'
        required: false
        default: ''

  schedule:
    # Eric, 15 Sep 2026: "the emails are supposed to go out at 7am man". They were not. The
    # window config was right all along (06:30-07:30 ET, jittered per physician); this job simply
    # was not awake. '*/15 10-21' asks for 48 runs a day and GitHub was delivering three to five,
    # the earliest around 09:19 ET. So every batch waited for the first run of the day and then
    # left in one clump: 17 emails at 12:08 on 14 Sep, 13 at 10:37 on 15 Sep. That clump is also a
    # deliverability problem, because the per-physician jitter exists precisely so a batch does not
    # look machine-timed, and sending them all in one minute throws that away.
    #
    # Discrete crons are honoured far more reliably than a high-frequency band, so the send window
    # is now spelled out minute by minute. Times are UTC and Eastern is UTC-4 from March to
    # November; the extra 11:30-12:35 entries cover 06:30-07:35 ET once the clocks go back, and the
    # send-window config in outreach_config is what actually decides, computed in the physician's
    # own timezone, so the out-of-season attempts simply find nothing due.
    # Every day, not 1-5: this repo already found that weekday-restricted crons were not firing,
    # which is why every job here runs daily and stops itself on the weekend in the step below.
    # These are EDT (UTC-4), correct until the clocks go back on 1 Nov 2026. They are NOT
    # pre-loaded with the EST equivalents: in September those would fire at 07:30-08:30 ET, which
    # is outside the window and burns the scarce morning runs this fix exists to protect. Shift
    # each hour up by one in November.
    - cron: '25,35,45,55 10 * * *'    # 06:25-06:55 ET
    - cron: '5,15,25 11 * * *'        # 07:05-07:25 ET
    # Sparse backstop so an answer or a manually queued row is never stranded all day. These are
    # outside the cold-outreach window, and the window logic refuses cold mail at these hours.
    - cron: '20 15,18,21 * * *'
    # Eric, 8 Sep 2026: one batch goes out Thursday evening instead of before clinic, because the
    # physicians who read these do it at night. 8pm Eastern is midnight UTC, which the band above
    # does not reach. Thursday 8pm ET is Friday 00:00 UTC, hence day 5 here.
    - cron: '*/15 0-1 * * 5'   # Friday 00:00-01:00 UTC = Thursday 8pm to 9pm Eastern

concurrency:
  group: auto-send
  cancel-in-progress: false   # never cut a send run short

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send what is due
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MDC_CRON_SECRET: ${{ secrets.MDC_CRON_SECRET }}
          IDS: ${{ github.event.inputs.ids }}
        run: |
          # The cron runs every day because weekday-restricted schedules were not firing.
          # Saturday is 6 and Sunday is 7, so anything from 6 up stops here.
          if [ "$(date -u +%u)" -ge 6 ]; then echo "weekend, nothing to do"; exit 0; fi
          # Sending one specific row on demand, rather than everything that happens to be due. A run
          # meant to release a single held email must never become a send of the whole queue.
          if [ -n "$IDS" ]; then
            PAYLOAD="{\"ids\":[$IDS]}"
            echo "sending only rows: $IDS"
          else
            PAYLOAD='{}'
          fi
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            'https://pjdbzrzadlldojuvdrfj.supabase.co/functions/v1/send-outreach' \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-mdc-cron: $MDC_CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "send-outreach returned $code"
            exit 1
          fi
