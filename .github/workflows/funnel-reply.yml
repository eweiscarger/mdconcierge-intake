name: Funnel reply agent
# Reads eric@mdconcierge.net for FUNNEL-lead replies, classifies them, auto-handles
# opt-outs + stage transitions, and queues grounded drafts (read-only, SENDS NOTHING).
# Separate from the referrals@ engine (intake.yml) and the MDRx inbox (mdrx-inbox.yml).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'   # every ~15 minutes (GitHub may delay)

concurrency:
  group: funnel-reply
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Scan eric@ for funnel replies, classify, queue drafts
        env:
          ERIC_USER: eric@mdconcierge.net
          MDRX_ERIC_PASS: ${{ secrets.MDRX_ERIC_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node funnel-reply.mjs
